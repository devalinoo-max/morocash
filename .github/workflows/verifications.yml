# Vérifie les types et le lint à chaque push et à chaque pull request.
# Les tests du backend n'y sont pas : ils écrivent dans une vraie base Neon
# (voir vitest.config.mts) et se lancent à la main avec `npm test`.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — types et lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `prisma.config.ts` exige DATABASE_URL et DIRECT_URL. Générer le client
      # ne se connecte à rien : des adresses factices suffisent ici, la vraie
      # base reste hors du CI.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx tsc --noEmit
      - run: npm run lint

  frontend:
    name: Frontend — types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
